# Session-routine parameters — see the session-routines skill, §0.
# ARCHIVES is RELATIVE to the repo root: the scripts resolve "$REPO/$ARCHIVES"
# and append the <project> level themselves.
#
# Archives do NOT live in this repo, and the reason is not convenience: this
# repo is PUBLIC. A transcript records what a command *displayed*, and exchange
# segments are redacted by hand — on a public repo that manual step becomes a
# single point of failure. They go to a private repo instead.
#
# Nor do they live in the homelab documentation repo: what decides where an
# archive belongs is the SUBJECT of the host repo, not its convenience. That
# repo documents the homelab; this one configures a workstation.
ARCHIVES="../Archives"

# No scopes: a single domain here, the parameter would be noise.
SCOPES=""
